spring:
  application:
    name: workplace-room-booking
  datasource:
    url: jdbc:h2:file:./.data/room-booking;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  address: 127.0.0.1
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: false
booking:
  policy:
    zone: Europe/Bratislava
    opens-at: "07:00"
    closes-at: "20:00"
    maximum-duration: PT4H
    advance-window: P90D
  development:
    users:
      - username: alice
        password: alice-local-only
        role: EMPLOYEE
      - username: bob
        password: bob-local-only
        role: EMPLOYEE
      - username: facilities
        password: facilities-local-only
        role: FACILITY_ADMIN
